name: iOS build, test & TestFlight

on:
  push:
    branches: [main]
    paths: ["ios/**", ".github/workflows/ios.yml", "scripts/write_asc_key.sh", "scripts/asc.py"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Upload the build to TestFlight"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: false

env:
  BUNDLE_ID: com.surproductions.triviaclash
  PROJECT: ios/TriviaClash.xcodeproj
  SCHEME: TriviaClash

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          xcodebuild -version
          brew install xcodegen >/dev/null
          xcodegen --version

      - name: Generate Xcode project
        run: cd ios && xcodegen generate

      - name: Unit tests (iOS Simulator)
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json,sys
          d=json.load(sys.stdin)['devices']
          ios=[(k,v) for k,v in d.items() if 'iOS' in k]
          ios.sort(key=lambda kv: [int(x) for x in kv[0].split('iOS-')[-1].split('-')])
          for k,v in reversed(ios):
              phones=[x for x in v if x['name'].startswith('iPhone')]
              if phones:
                  print(phones[0]['udid']); break
          ")
          echo "Simulator: $UDID"
          set -o pipefail
          xcodebuild test -project "$PROJECT" -scheme "$SCHEME" -destination "id=$UDID" \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" CODE_SIGNING_ALLOWED=NO | tee "$RUNNER_TEMP/test.log" | grep -E "error:|warning: .*TriviaClash|Test Case .* (passed|failed)|Executed|TEST (SUCCEEDED|FAILED)" || true
          grep -q "TEST SUCCEEDED" "$RUNNER_TEMP/test.log"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            ${{ runner.temp }}/tests.xcresult
            ${{ runner.temp }}/test.log
          if-no-files-found: ignore

      - name: App Store Connect key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY=$(scripts/write_asc_key.sh)
          echo "ASC_KEY_PATH=$KEY" >> "$GITHUB_ENV"
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          ASC_KEY_PATH="$KEY" python3 scripts/asc.py ensure-bundle-id "$BUNDLE_ID" "Trivia Clash"
          APP=$(ASC_KEY_PATH="$KEY" python3 scripts/asc.py apps | awk -F'\t' -v b="$BUNDLE_ID" '$2==b {print $3}')
          echo "ASC_APP_ID=$APP" >> "$GITHUB_ENV"
          if [ -n "$APP" ]; then
            LAST=$(ASC_KEY_PATH="$KEY" python3 scripts/asc.py latest-build "$APP")
          else
            LAST=0
            echo "::warning::No App Store Connect app record uses $BUNDLE_ID yet. The IPA will be built, but TestFlight upload needs the record (App Store Connect › Apps › + › New App)."
          fi
          # Build numbers must increase for every upload: use a UTC timestamp, bumped past the latest upload.
          STAMP=$(date -u +%Y%m%d%H%M)
          BUILD=$(( STAMP > LAST ? STAMP : LAST + 1 ))
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Build number: $BUILD"

      - name: Archive (Release, automatic signing)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -o pipefail
          xcodebuild archive -project "$PROJECT" -scheme "$SCHEME" -configuration Release \
            -destination "generic/platform=iOS" -archivePath "$RUNNER_TEMP/TriviaClash.xcarchive" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tee "$RUNNER_TEMP/archive.log" | grep -E "error:|warning: .*signing|ARCHIVE (SUCCEEDED|FAILED)|Signing Identity|Provisioning Profile" || true
          grep -q "ARCHIVE SUCCEEDED" "$RUNNER_TEMP/archive.log"

      - name: Export IPA (App Store Connect distribution)
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          sed "s/TEAM_ID_PLACEHOLDER/$APPLE_TEAM_ID/" ios/ExportOptions.plist > "$RUNNER_TEMP/ExportOptions.plist"
          set -o pipefail
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/TriviaClash.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            | tail -30
          ls -la "$RUNNER_TEMP/export"

      - name: Verify IPA
        run: |
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          test -s "$IPA"
          cp "$IPA" "$RUNNER_TEMP/TriviaClash-1.0.0-$BUILD_NUMBER.ipa"
          echo "IPA_PATH=$RUNNER_TEMP/TriviaClash-1.0.0-$BUILD_NUMBER.ipa" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/verify" && cd "$RUNNER_TEMP/verify" && unzip -q "$IPA"
          APP=$(ls -d Payload/*.app)
          echo "Size: $(du -h "$IPA" | cut -f1)"
          echo "Bundle id: $(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")"
          echo "Version:   $(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$APP/Info.plist") ($(/usr/libexec/PlistBuddy -c 'Print CFBundleVersion' "$APP/Info.plist"))"
          test "$(/usr/libexec/PlistBuddy -c 'Print CFBundleIdentifier' "$APP/Info.plist")" = "$BUNDLE_ID"
          test -f "$APP/questions.bin"
          codesign --verify --deep --strict "$APP" && echo "Code signature: valid"
          codesign -dv "$APP" 2>&1 | grep -E "Authority|TeamIdentifier" | head -3
          security cms -D -i "$APP/embedded.mobileprovision" > profile.plist
          echo "Profile:   $(/usr/libexec/PlistBuddy -c 'Print Name' profile.plist)"
          echo "Expires:   $(/usr/libexec/PlistBuddy -c 'Print ExpirationDate' profile.plist)"
          echo "Devices:   $(/usr/libexec/PlistBuddy -c 'Print ProvisionedDevices' profile.plist 2>/dev/null | grep -c '^ ' || echo 0) (0 = App Store distribution)"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TriviaClash-ipa
          path: ${{ env.IPA_PATH }}

      - name: Upload to TestFlight
        if: ${{ github.event_name == 'push' || inputs.upload }}
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          if [ -z "$ASC_APP_ID" ]; then
            echo "::error::App Store Connect has no app with bundle id $BUNDLE_ID. Create it (Apps › + › New App) and re-run this workflow."
            exit 1
          fi
          xcrun altool --upload-app -f "$IPA_PATH" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID" --output-format normal

      - name: Publish GitHub release with the IPA
        if: always() && env.IPA_PATH != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v1.0.0-build.$BUILD_NUMBER"
          gh release create "$TAG" "$IPA_PATH" --target "$GITHUB_SHA" --prerelease \
            --title "Trivia Clash 1.0.0 (build $BUILD_NUMBER)" \
            --notes "App Store Connect–signed IPA built by CI from ${GITHUB_SHA::7}. Install through TestFlight; this IPA cannot be sideloaded directly onto a device."
