name: Environment probe

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          ls -d /Applications/Xcode*.app
          xcodebuild -version
          xcrun simctl list runtimes | tail -5
          which xcodegen || echo "xcodegen not installed"
      - name: Secrets present
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          for v in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -n "${!v}" ]; then echo "$v: set (${#v} name, ${#ASC_KEY_P8} p8 chars)"; else echo "$v: MISSING"; fi
          done
          if printf '%s' "$ASC_KEY_P8" | grep -q "BEGIN PRIVATE KEY"; then echo "p8 format: PEM"; else echo "p8 format: not PEM (maybe base64)"; fi
      - name: App Store Connect apps
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          KEY=$(scripts/write_asc_key.sh)
          python3 -m pip install --quiet --break-system-packages pyjwt cryptography || python3 -m pip install --quiet pyjwt cryptography
          ASC_KEY_PATH="$KEY" python3 scripts/asc.py apps
          xcrun simctl list runtimes | grep -i ios || true
